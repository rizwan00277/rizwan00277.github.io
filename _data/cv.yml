        url: https://www.ncp.edu.pk/coe-aitec.php
        start_date: 2025-05-01
        end_date: present
        highlights:
          - "Built a paired RGB-thermal benchmark for small road-user detection from FLIR ADAS v1.3 (52,857 new RGB object annotations across 9,598 paired frames) and designed MaxSPD-YOLO11n, improving small-object AP from 31.5% to 36.0% (RGB) with 43% fewer parameters (ICCII 2026, under review)."
          - "Audited shortcut learning in video-based PTSD detection: under stricter subject-grouped, source-disjoint and metadata-balanced evaluation, reported face-model performance drops sharply (ICIC 2026, accepted)."
          - "Built a subject-independent benchmark for aerial gesture recognition from drone video; synthetic-skeleton pretraining improves every deep model (macro-F1 +0.10 to +0.25) (ICACS 2027, under review)."
          - "Developed a marker-free multi-camera localization system: fine-tuned YOLOv8n detection, stereo 3-D lifting and floor-plane projection reduce mean error from 14.4 to 5.8 cm at about 30 FPS per camera (ICACS 2027, under review)."
          - "Deployed vision models on real platforms: depth-based deep RL navigation on TurtleBot 4, a GPS-denied indoor drone with visual odometry, and an LLM-guided navigation assistant (ROS 2, NVIDIA Jetson)."
          - "Co-supervise student projects on visual SLAM (ORB-SLAM3) and an autonomous hexapod pick-and-place system."

