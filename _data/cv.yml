        highlights:
          - "Developed a Soft Actor-Critic (SAC) deep RL agent for mapless navigation and obstacle avoidance, trained in Gazebo (~650k steps) and transferred to a real TurtleBot 4 on ROS 2 using an OAK-D depth camera as a pseudo-LiDAR."
          - "Built a dual ZED 2i stereo-camera system that tracks and globally localizes multiple robots in an 8 x 4 m arena in real time (YOLO + stereo depth + Hungarian cross-camera assignment, PyQt5 GUI, up to 60 FPS)."
          - "Integrated a GPS-denied indoor drone (Pixhawk 6X / ArduPilot, Jetson Orin Nano, ZED Mini): MAVROS visual-pose bridge, EKF3 tuning, and real indoor flight; now developing autonomous waypoint missions."
          - "Built an LLM-guided navigation assistant combining SLAM, Nav2, YOLO, locally deployed LLMs, and speech interfaces."
          - "Co-supervise student projects on visual SLAM (ORB-SLAM3) and an autonomous hexapod pick-and-place system."

