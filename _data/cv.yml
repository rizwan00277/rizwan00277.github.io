  summary: Computer vision and deep learning researcher focused on small-object detection. My MS thesis at PIEAS (Gold Medal) redesigned YOLOv8 for small and distant drones; at the AI Technology Centre (AITeC), Islamabad, I continue this work on compact detectors for small drones and small road users in RGB and thermal images, and on reliable evaluation of deep models. Seeking a PhD (Fall 2027) in computer vision and deep learning.

