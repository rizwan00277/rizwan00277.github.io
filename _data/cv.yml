        highlights:
          - "Built a paired RGB-thermal benchmark for small road-user detection from FLIR ADAS v1.3 (52,857 new RGB object annotations across 9,598 paired frames) and proposed MaxSPD-YOLO11n, a lightweight detector for small road users (ICCII 2026, under review)."
          - "Studied shortcut learning in video-based PTSD detection under progressively stricter subject-grouped, source-disjoint and metadata-balanced evaluation (ICIC 2026, accepted)."
          - "Built a subject-independent benchmark for gesture recognition from drone video and studied synthetic-skeleton pretraining (ICACS 2027, under review)."
          - "Developed a marker-free system that localizes multiple ground robots with two stereo cameras, using YOLOv8n detection, stereo depth and floor-plane calibration (ICACS 2027, under review)."
          - "Applied vision and learning methods on real platforms: deep reinforcement learning navigation on TurtleBot 4, vision-based indoor drone flight, and an LLM-guided navigation assistant (ROS 2, NVIDIA Jetson)."
          - "Help supervise student projects on visual SLAM (ORB-SLAM3) and an autonomous hexapod pick-and-place system."

