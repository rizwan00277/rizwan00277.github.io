  summary: Research Associate at the AI Technology Centre (AITeC), Islamabad, with research interests in computer vision and deep learning, particularly small-object detection. My MS thesis at PIEAS worked on improving YOLOv8 for small and distant drones, and my current work studies lightweight detectors for small drones and road users in RGB and thermal images, and the evaluation of deep models. At AITeC I also apply vision methods on robots and drones.

